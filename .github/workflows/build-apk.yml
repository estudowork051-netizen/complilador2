name: Build Android Debug APK

'on':
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Gradle Wrapper & Permissions
        run: |
          set -e
          chmod +x gradlew
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || [ $(wc -c < "gradle/wrapper/gradle-wrapper.jar") -lt 1000 ]; then
            echo "Generating official Gradle Wrapper JAR with Gradle 8.7..."
            gradle wrapper --gradle-version 8.7
          fi
          echo "Verifying Gradle Wrapper JAR integrity against official release checksum..."
          WRAPPER_JAR="gradle/wrapper/gradle-wrapper.jar"
          if [ ! -f "$WRAPPER_JAR" ]; then
            echo "::error::Gradle Wrapper JAR was not generated!"
            exit 1
          fi
          JAR_HASH=$(sha256sum "$WRAPPER_JAR" | awk '{print $1}')
          echo "Gradle Wrapper JAR SHA-256: $JAR_HASH"
          EXPECTED_HASH="cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8"
          if [ "$JAR_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::Generated Wrapper JAR hash ($JAR_HASH) does not match official Gradle 8.7 release checksum ($EXPECTED_HASH)!"
            exit 1
          fi
          echo "SUCCESS: Gradle Wrapper JAR verified against official Gradle 8.7 checksum."

      - name: Run Unit Tests
        run: |
          set -e
          echo "Executing Unit Tests..."
          ./gradlew testDebugUnitTest --stacktrace

      - name: Compile Debug APK
        run: |
          set -e
          echo "Compiling Android Debug APK..."
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generation
        run: |
          set -e
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::CRITICAL: Build completed without generating the APK at expected path: $APK_PATH"
            find app/build -name "*.apk" || true
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null || wc -c < "$APK_PATH")
          if [ "$APK_SIZE" -le 0 ]; then
            echo "::error::CRITICAL: Generated APK is empty (0 bytes)!"
            exit 1
          fi
          echo "SUCCESS: Debug APK verified at $APK_PATH (Size: $APK_SIZE bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heroes-tower-defense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
