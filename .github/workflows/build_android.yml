name: Build Android APK (Godot 4.3)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar a compilação manualmente com 1 clique

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Gerar Chave de Depuração (Debug Keystore)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Baixar Godot 4.3 e Modelos de Exportação
        run: |
          # 1. Baixa o executável Godot 4.3
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -f Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip

          # 2. Baixa e instala os Templates de Exportação Android
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p ~/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_RELEASE}
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/
          cp -r templates/* ~/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_RELEASE}/
          rm -rf templates Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz

      - name: Configurar Editor Settings do Godot
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Executar Validação Automatizada de Testes (75 testes)
        run: |
          python3 tests/test_runner.py

      - name: Criar Pasta de Saída
        run: mkdir -p build

      - name: Compilar APK Android (Godot Headless)
        run: |
          godot --headless --export-debug "Android" build/guardians_of_the_last_base_debug.apk

      - name: Validar e Garantir Assinatura do APK (v2 e v3)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Build-tools localizado em: $BUILD_TOOLS_DIR"
          
          # Se não estiver assinado com v2/v3, assina via apksigner
          if ! $BUILD_TOOLS_DIR/apksigner verify build/guardians_of_the_last_base_debug.apk; then
            echo "Assinando APK com apksigner (Signature Scheme v2/v3)..."
            $BUILD_TOOLS_DIR/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android build/guardians_of_the_last_base_debug.apk
          fi
          
          echo "Status final da assinatura:"
          $BUILD_TOOLS_DIR/apksigner verify --verbose build/guardians_of_the_last_base_debug.apk

      - name: Enviar APK Gerado como Artefato (Download Disponível)
        uses: actions/upload-artifact@v4
        with:
          name: Guardians-Last-Base-Android-APK
          path: build/guardians_of_the_last_base_debug.apk
          retention-days: 14
